name: "✨ Feature Request"
description: Suggest a new feature or enhancement for VanaTell
title: "[FEATURE] "
labels:
  - feat
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please help us understand your use case.

        Every feature comes to Windower, Ashita, iPhone and Android alike, so there is no need to pick a platform.

        Before submitting, please check if this feature has already been requested by searching [existing requests](https://github.com/rshelnutt/vanatell/issues?q=is%3Aissue+label%3Afeat).

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight Checklist
      options:
        - label: I have searched [existing requests](https://github.com/rshelnutt/vanatell/issues?q=is%3Aissue+label%3Afeat+label%3Aenhancement) and this feature hasn't been requested yet
          required: true
        - label: This is a single feature request (not multiple features)
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve? Focus on the problem, not the solution.
      placeholder: |
        When I'm away from the PC I can't tell which linkshell members are online...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
      placeholder: |
        I'd like the app to show...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: What alternatives have you considered or tried?
      placeholder: |
        Currently I...
    validations:
      required: false

  - type: dropdown
    id: feature_area
    attributes:
      label: Feature Area
      description: What area does this feature relate to?
      options:
        - Tells
        - Party chat
        - Linkshells
        - Pairing
        - Notifications
        - Connection
        - Updating the addon
        - UI/UX
        - Other
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case Example
      description: Provide a concrete, real-world scenario of when you'd use this feature.
      placeholder: |
        1. I'm away from the PC during an event
        2. I want to...
        3. With this feature I could...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Mockups, examples, links to similar features in other tools, etc.
    validations:
      required: false
